# cats-plugin.toml registers cats-todo with the cats plugin host.
#
# cats-todo is a standalone repo, so the plugin flow is the normal one (it also
# doubles as the reference manifest for writing new plugins):
#
#   Install:            catctl plugin install rohanthewiz/cats-todo
#   Local development:  catctl plugin link .   (from this checkout)
#   Launch:             catctl plugin run rohanthewiz.cats-todo
#
# The manifest shape mirrors herdr-plugin.toml (which this tool was originally
# written against), minus herdr's [[panes]] table: a cats action runs its TUI
# directly in the tab that `plugin run` opens via tab.create's spawn params.

id = "rohanthewiz.cats-todo"
name = "Cats Todo"
version = "0.4.1"
description = "A prompt backlog for cats. Jot down prompts of future work (per-project and global), then fuzzy-pick one and drop it into a Claude Code session — an existing agent pane or a brand-new one — paste-only or run-now."
platforms = ["linux", "macos"]

# Build the binary at install/link time; the host runs this once in the plugin
# root. cats-todo is its own Go module, so a plain `go build .` resolves
# everything from this repo's go.mod.
[[build]]
command = ["sh", "-c", "mkdir -p bin && go build -o bin/cats-todo ."]

# The manager TUI, pinned to one backlog per action so each picker entry
# means exactly what it says: "this project" shows only the project backlog
# (--project — global todos would read as leakage under that label) and
# "global only" shows only the global one (--global). The merged view remains
# the bare `cats-todo` launch in any shell pane. First action = the default
# for a bare `plugin run`, so project-scoped stays the default; the tab's cwd
# (the directory you invoked from / the focused pane) is what scopes the
# per-project backlog (.cats-todo/).
[[actions]]
id = "todo"
title = "Cats Todo — this project"
command = ["./bin/cats-todo", "--project"]

[[actions]]
id = "todo-global"
title = "Cats Todo — global only"
command = ["./bin/cats-todo", "--global"]
